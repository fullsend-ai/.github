# Safe-settings org-level defaults, applied to every repository unless
# repos/<repo>.yml overrides a key. Schema: safe-settings
# docs/sample-settings/settings.yml.
#
# ACCESS BOUNDARY: peribolos owns all access. Never add `teams:` or
# `collaborators:` keys here -- those plugins delete unlisted entries
# and would fight peribolos.

repository:
  delete_branch_on_merge: true
  security:
    enableVulnerabilityAlerts: true
    enableAutomatedSecurityFixes: true

# Baseline protection for every default branch: main changes only
# through PRs. Approval counts stay per-repo (repos/*.yml) so
# autonomous merges keep working; this floor cannot be loosened by a
# repo file -- org rulesets stack. The org's automation Apps bypass;
# workflows pushing to main with GITHUB_TOKEN will need a PR flow or a
# bypass actor added here.
rulesets:
  - name: default-branch
    description: Baseline protection for every default branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
      repository_name:
        exclude:
          - devlake # fork synced by direct push; see repos/devlake.yml
          - agent-eval-harness # semantic-release pushes to main with GITHUB_TOKEN; see repos/agent-eval-harness.yml
    bypass_actors:
      - actor_id: 4113971 # renovate-fullsend
        actor_type: Integration
        bypass_mode: always
      - actor_id: 4648700 # fullsend-ai-sync
        actor_type: Integration
        bypass_mode: always
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          require_code_owner_review: true # bites only where CODEOWNERS exists
          require_extra_approval_for_unattributed_changes: true
          required_review_thread_resolution: true
          allowed_merge_methods: [merge, squash, rebase]
