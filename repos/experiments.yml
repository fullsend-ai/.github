# Snapshotted from the live ruleset (2026-10-23).
rulesets:
- name: main
  target: branch
  enforcement: active
  conditions:
    ref_name:
      include:
      - ~DEFAULT_BRANCH
  bypass_actors:
  - actor_id: 4648700 # fullsend-ai-sync
    actor_type: Integration
    bypass_mode: always
  rules:
  - type: deletion
  - type: non_fast_forward
  - type: pull_request
    parameters:
      require_extra_approval_for_unattributed_changes: true
      allowed_merge_methods:
      - merge
      - squash
      - rebase
  - type: merge_queue
    parameters:
      merge_method: MERGE
      max_entries_to_build: 5
      min_entries_to_merge: 1
      max_entries_to_merge: 5
      min_entries_to_merge_wait_minutes: 5
      grouping_strategy: ALLGREEN
      check_response_timeout_minutes: 60
